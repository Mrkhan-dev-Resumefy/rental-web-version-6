<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <!-- MASCOT ICON -->
  <g id="mascot-icon">
    <!-- Blue Flag on Roof Peak -->
    <path d="M 50 6 L 50 24" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    <path d="M 50 7 L 68 14 L 50 21 Z" fill="#1D4ED8" stroke="#111827" stroke-width="2" stroke-linejoin="round" />

    <!-- Red Triangle Roof -->
    <path d="M 12 50 L 50 20 L 88 50 Z" fill="#E53935" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Yellow Bounce House Body -->
    <rect x="14" y="47" width="72" height="46" rx="12" fill="#FBC02D" stroke="#111827" stroke-width="4.5" />

    <!-- Left Eye (Blue iris with white glint) -->
    <circle cx="36" cy="67" r="9" fill="#FFFFFF" stroke="#111827" stroke-width="3" />
    <circle cx="36" cy="67" r="5.2" fill="#2563EB" />
    <circle cx="36" cy="67" r="2.8" fill="#111827" />
    <circle cx="34.5" cy="65.2" r="1.3" fill="#FFFFFF" />

    <!-- Right Eye (Playful circle / wink eye) -->
    <circle cx="64" cy="67" r="9" fill="#FFFFFF" stroke="#111827" stroke-width="3" />
    <circle cx="64" cy="67" r="5.2" fill="#FBC02D" />
    <circle cx="64" cy="67" r="2.8" fill="#111827" />
    <circle cx="62.5" cy="65.2" r="1.3" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <path d="M 35 81 Q 50 90 65 81" stroke="#111827" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
