<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" className="tent-logo-graphic">
  <!-- Top Center Pole & Pink Flag -->
  <path d="M 50.3 30.8 L 50.3 37.8" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 51 32.5 C 55 31.5 59.5 33 63.5 35.5 C 59 38.5 55 37 51 38.5 Z" fill="#F43F5E" />

  <!-- Tent Canopy Roof Fill -->
  <!-- Left Outer Cyan Sweep Edge & Stripe -->
  <path d="M 50 37.5 Q 26 53 1.5 79.5 Q 18.5 75 34.5 77 Q 43 56 50 37.5 Z" fill="#00A8B5" />
  
  <!-- Left White Stripe -->
  <path d="M 50 37.5 Q 43 56 34.5 77 Q 41.5 79.5 49 81.5 Q 49.6 59 50 37.5 Z" fill="#FFFFFF" />
  
  <!-- Center Golden Yellow Stripe -->
  <path d="M 50 37.5 Q 49.6 59 49 81.5 Q 54.5 83 60 81.5 Q 55 59 50 37.5 Z" fill="#FBBF24" />
  
  <!-- Right White Stripe -->
  <path d="M 50 37.5 Q 55 59 60 81.5 Q 67 79.5 74 77 Q 62.5 56 50 37.5 Z" fill="#FFFFFF" />
  
  <!-- Right Orange Stripe -->
  <path d="M 50 37.5 Q 62.5 56 74 77 Q 82 74 88.5 77.5 Q 68.5 55 50 37.5 Z" fill="#F97316" />

  <!-- Right Coral/Pink Eaves Wing & Outer Edge -->
  <path d="M 50 37.5 Q 74 53 98.5 79.5 Q 85 75.5 74 77 Q 62.5 56 50 37.5 Z" fill="#F43F5E" />

  <!-- Sweeping Outer Canopy Outlines -->
  <path d="M 50 37.5 Q 26 53 1.5 79.5" stroke="#00A8B5" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <path d="M 50 37.5 Q 74 53 98.5 79.5" stroke="#F43F5E" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Scalloped White Draped Valance / Lower Edge -->
  <path d="M 19 81.5 Q 50 93.5 81 81.5 L 81 84.5 Q 50 96 19 84.5 Z" fill="#FFFFFF" />
  <path d="M 19 81.5 Q 50 93.5 81 81.5" stroke="#00A8B5" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
  <path d="M 19 84.5 Q 50 96 81 84.5" stroke="#E2E8F0" stroke-width="0.8" fill="none" />

  <!-- Bunting Pennant Flags (Hanging from Valance) -->
  <!-- 1. Purple -->
  <polygon points="27,85.2 32.5,86 29.5,90.5" fill="#7C3AED" />
  <!-- 2. Yellow -->
  <polygon points="37,88.2 43,89.5 39.5,93.5" fill="#FBBF24" />
  <!-- 3. Coral / Pink (Center) -->
  <polygon points="47.5,90.5 53.5,90.5 50.5,96" fill="#F43F5E" />
  <!-- 4. Cyan / Teal -->
  <polygon points="58,89.5 64,88.2 61.5,93.5" fill="#06B6D4" />
  <!-- 5. Orange -->
  <polygon points="68.5,86 74,85.2 71.5,90.5" fill="#F97316" />

  <!-- Supporting Vertical Poles / Legs -->
  <!-- Left Outer Pole (Cyan) -->
  <path d="M 8 78 L 8 97" stroke="#00A8B5" stroke-width="2.2" stroke-linecap="round" />
  <!-- Left Inner Pole (Light Teal) -->
  <path d="M 19 81.5 L 19 97" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" />
  <!-- Center Pole (Gold/Yellow) -->
  <path d="M 50.3 84.5 L 50.3 96" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right Inner Pole (Light Orange) -->
  <path d="M 81 81.5 L 81 97" stroke="#FB923C" stroke-width="2" stroke-linecap="round" />
  <!-- Right Outer Pole (Pink/Coral) -->
  <path d="M 92 78 L 92 97" stroke="#F43F5E" stroke-width="2.2" stroke-linecap="round" />
</svg>
