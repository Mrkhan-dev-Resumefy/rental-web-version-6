<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- MASCOT ICON -->
  <g id="mascot" transform="translate(10, 4)">
    <!-- Blue Flag on Roof Peak -->
    <path d="M 46 2 L 46 16" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 46 3 L 60 8 L 46 13 Z" fill="#1D4ED8" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Red Triangle Roof -->
    <path d="M 12 40 L 46 14 L 80 40 Z" fill="#E53935" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Yellow Bounce House Body -->
    <rect x="14" y="38" width="64" height="50" rx="12" fill="#FBC02D" stroke="#111827" stroke-width="3.5" />

    <!-- Left Eye (Blue iris with white glint) -->
    <circle cx="34" cy="59" r="8.5" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" />
    <circle cx="34" cy="59" r="4.8" fill="#2563EB" />
    <circle cx="34" cy="59" r="2.5" fill="#111827" />
    <circle cx="32.5" cy="57.5" r="1.2" fill="#FFFFFF" />

    <!-- Right Eye (Playful circle / wink eye) -->
    <circle cx="58" cy="59" r="8.5" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" />
    <circle cx="58" cy="59" r="4.8" fill="#FBC02D" />
    <circle cx="58" cy="59" r="2.5" fill="#111827" />
    <circle cx="56.5" cy="57.5" r="1" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <path d="M 33 74 Q 46 83 59 74" stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- BRAND NAME: Events & Rentals -->
  <g id="brand-text" transform="translate(112, 65)">
    <!-- Base text "Events & Rent" -->
    <text x="0" y="0" font-family="'Nunito', 'Fredoka', system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#111827" letter-spacing="-0.5px">
      Events &amp; Rent<tspan dx="-2">a</tspan><tspan dx="-2">l</tspan><tspan dx="-2">s</tspan>
    </text>

    <!-- Festive colorful bubbles / balloon dots over "als" -->
    <!-- Red Balloon -->
    <circle cx="308" cy="-42" r="7.5" fill="#EF4444" stroke="#DC2626" stroke-width="1" />
    <path d="M 308 -34.5 L 308 -25" stroke="#991B1B" stroke-width="1" stroke-dasharray="1.5,1.5" stroke-linecap="round" />

    <!-- Golden Yellow Dot -->
    <circle cx="318" cy="-28" r="6" fill="#F59E0B" />

    <!-- Blue / Teal Dot -->
    <circle cx="323" cy="-15" r="4.5" fill="#0284C7" />
  </g>
</svg>
